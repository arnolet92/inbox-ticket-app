kind = "web"
previewPath = "/pharmasalepos/"
title = "InBox"
version = "1.0.0"
id = "artifacts/pharmasalepos"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pharmasalepos/" ]
localPort = 8082

[services.development]
run = "pnpm --filter @workspace/pharmasalepos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pharmasalepos", "run", "build" ]
publicDir = "artifacts/pharmasalepos/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8082"
BASE_PATH = "/pharmasalepos/"
